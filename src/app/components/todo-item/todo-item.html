<div class="todo-item" [class.completed]="todo.completed">
  <div *ngIf="!isEditing" class="todo-content">
    <div class="todo-checkbox">
      <input
        type="checkbox"
        [checked]="todo.completed"
        (change)="onToggle()"
        id="todo-{{ todo.id }}"
      />
      <label for="todo-{{ todo.id }}"></label>
    </div>

    <div class="todo-details">
      <h3 class="todo-title" [class.completed-text]="todo.completed">
        {{ todo.title }}
      </h3>
      <p class="todo-description" *ngIf="todo.description">
        {{ todo.description }}
      </p>
      <div class="todo-meta">
        <span class="todo-date">Created: {{ todo.createdAt | date: 'short' }}</span>
        <span class="todo-status" [class.status-completed]="todo.completed">
          {{ todo.completed ? 'Completed' : 'Pending' }}
        </span>
      </div>
    </div>

    <div class="todo-actions">
      <button (click)="startEdit()" class="btn-icon btn-edit" title="Edit">
        ✏️
      </button>
      <button (click)="onDelete()" class="btn-icon btn-delete" title="Delete">
        🗑️
      </button>
    </div>
  </div>

  <div *ngIf="isEditing" class="todo-edit-form">
    <div class="form-group">
      <input
        type="text"
        [(ngModel)]="editTitle"
        placeholder="Title"
        class="form-control"
      />
    </div>
    <div class="form-group">
      <textarea
        [(ngModel)]="editDescription"
        placeholder="Description"
        rows="2"
        class="form-control"
      ></textarea>
    </div>
    <div class="edit-actions">
      <button (click)="saveEdit()" [disabled]="!editTitle.trim()" class="btn btn-save">
        Save
      </button>
      <button (click)="cancelEdit()" class="btn btn-cancel">
        Cancel
      </button>
    </div>
  </div>
</div>
